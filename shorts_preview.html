<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유튜브 쇼츠 60초 인터랙티브 뷰어</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #0f0f0f;
      color: #fff;
    }
    .phone-frame {
      width: 380px;
      height: 760px;
      max-height: 92vh;
      border-radius: 36px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 10px #222;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #1f2430 0%, #0d0f14 100%);
    }
    .sound-disc {
      animation: spin 3s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .pulse-glow {
      animation: pulseGlow 1.8s infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(250, 204, 21, 0.4); }
      50% { transform: scale(1.08); box-shadow: 0 0 35px rgba(250, 204, 21, 0.8); }
    }
    .kinetic-text {
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9), 0 1px 3px rgba(0, 0, 0, 0.8);
      word-break: keep-all;
    }
    .typing-cursor::after {
      content: '|';
      animation: blink 0.8s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row items-center justify-center p-4 gap-8">

  <!-- 왼쪽: 9:16 모바일 쇼츠 플레이어 프레임 -->
  <div class="phone-frame flex flex-col justify-between select-none">
    
    <!-- 상단 상태바 & 노치 -->
    <div class="relative z-30 pt-3 px-6 flex justify-between items-center text-xs text-stone-400">
      <span id="clockDisplay">12:30</span>
      <div class="w-20 h-4 bg-black rounded-full mx-auto"></div>
      <div class="flex items-center gap-1.5 text-[10px]">
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>
      </div>
    </div>

    <!-- 비디오 씬 애니메이션 레이어 -->
    <div id="sceneContainer" class="absolute inset-0 flex flex-col items-center justify-center px-6 text-center z-10 transition-all duration-500">
      <!-- 씬 콘텐츠가 JS로 동적 교체됨 -->
    </div>

    <!-- 우측 오버레이 버튼 (쇼츠 액션) -->
    <div class="absolute right-3 bottom-24 flex flex-col items-center gap-5 z-30 text-white text-xs">
      <button onclick="toggleLike()" class="flex flex-col items-center gap-1 group">
        <div id="likeBtn" class="w-11 h-11 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-xl transition group-active:scale-90">
          <i class="fa-solid fa-thumbs-up"></i>
        </div>
        <span id="likeCount" class="font-bold">4.2K</span>
      </button>

      <button class="flex flex-col items-center gap-1 group">
        <div class="w-11 h-11 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-xl">
          <i class="fa-solid fa-thumbs-down"></i>
        </div>
        <span class="text-[11px]">싫어요</span>
      </button>

      <button class="flex flex-col items-center gap-1 group">
        <div class="w-11 h-11 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-xl">
          <i class="fa-solid fa-comment-dots"></i>
        </div>
        <span class="font-bold">284</span>
      </button>

      <button class="flex flex-col items-center gap-1 group">
        <div class="w-11 h-11 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-xl">
          <i class="fa-solid fa-share"></i>
        </div>
        <span class="text-[11px]">공유</span>
      </button>

      <div class="w-10 h-10 rounded-full border-2 border-white/60 bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center text-white sound-disc mt-1 shadow-lg">
        <i class="fa-solid fa-music text-xs"></i>
      </div>
    </div>

    <!-- 하단 채널 정보 및 자막 오버레이 -->
    <div class="relative z-30 p-5 pb-6 bg-gradient-to-t from-black via-black/70 to-transparent">
      <!-- 채널 정보 -->
      <div class="flex items-center gap-2 mb-2">
        <div class="w-8 h-8 rounded-full bg-amber-400 flex items-center justify-center text-stone-900 font-black text-sm">
          AI
        </div>
        <span class="font-bold text-sm tracking-tight">@시니어_AI꿀팁</span>
        <button class="ml-2 px-3 py-1 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-full shadow">
          구독
        </button>
      </div>

      <!-- 영상 타이틀 -->
      <p class="text-xs text-stone-200 line-clamp-2 leading-relaxed mb-3">
        스마트폰 자판 독수리 타법 끝! 1초 만에 말로 카톡 보내는 법 #시니어스마트폰 #쇼츠
      </p>

      <!-- 프로그레스 타임 바 -->
      <div class="w-full bg-white/20 h-1 rounded-full overflow-hidden cursor-pointer" onclick="seek(event)">
        <div id="progressBar" class="bg-red-600 h-full w-0 transition-all duration-200"></div>
      </div>
      <div class="flex justify-between text-[10px] text-stone-400 mt-1 font-mono">
        <span id="currentTimeLabel">00:00</span>
        <span id="totalDurationLabel">00:58</span>
      </div>
    </div>

    <!-- 재생/일시정지 큰 오버레이 버튼 -->
    <button id="centerPlayBtn" onclick="togglePlay()" class="absolute inset-0 z-20 flex items-center justify-center bg-black/30 hover:bg-black/20 transition backdrop-blur-[1px]">
      <div class="w-16 h-16 rounded-full bg-white/90 text-stone-900 flex items-center justify-center text-2xl shadow-2xl pl-1">
        <i id="centerPlayIcon" class="fa-solid fa-play"></i>
      </div>
    </button>
  </div>

  <!-- 오른쪽: 조작 패널 및 대본 싱크 확인창 -->
  <div class="w-full max-w-md bg-stone-900 border border-stone-800 rounded-2xl p-6 shadow-xl flex flex-col gap-4">
    <div class="flex items-center justify-between border-b border-stone-800 pb-3">
      <div>
        <h2 class="text-lg font-black text-white flex items-center gap-2">
          <i class="fa-brands fa-youtube text-red-500"></i> 쇼츠 자동 생성 프리뷰
        </h2>
        <p class="text-xs text-stone-400">구체화 7대 체크리스트 기반 1번 대본 렌더링</p>
      </div>
      <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full font-bold">
        60초 큐시트 연동
      </span>
    </div>

    <!-- 컨트롤 버튼들 -->
    <div class="grid grid-cols-2 gap-2">
      <button onclick="togglePlay()" id="sidePlayBtn" class="py-2.5 px-4 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold flex items-center justify-center gap-2 text-sm shadow">
        <i class="fa-solid fa-play"></i> <span id="sidePlayText">영상 재생</span>
      </button>
      <button onclick="resetPlayback()" class="py-2.5 px-4 bg-stone-800 hover:bg-stone-700 text-stone-200 rounded-xl font-bold flex items-center justify-center gap-2 text-sm">
        <i class="fa-solid fa-rotate-right"></i> 처음부터 다시
      </button>
    </div>

    <!-- 음성 TTS 설정 옵션 -->
    <div class="flex items-center justify-between bg-stone-950 p-3 rounded-xl border border-stone-800 text-xs">
      <div class="flex items-center gap-2 text-stone-300">
        <i class="fa-solid fa-volume-high text-amber-400"></i>
        <span>AI 음성 읽기 (Web Speech TTS)</span>
      </div>
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" id="ttsToggle" checked class="sr-only peer">
        <div class="w-9 h-5 bg-stone-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-500"></div>
      </label>
    </div>

    <!-- 실시간 타임라인 대본 하이라이트 리스트 -->
    <div class="flex-1 overflow-y-auto max-h-72 space-y-2 pr-1" id="cueList">
      <!-- 큐 아이템들 -->
    </div>

    <!-- 대본 복사 버튼 -->
    <div class="pt-2 border-t border-stone-800 flex justify-between items-center text-xs text-stone-400">
      <span>파일: <code class="text-amber-400">C:/agy/kit02_youtube_media.md</code></span>
      <button onclick="copyFullScript()" class="text-stone-300 hover:text-white flex items-center gap-1 font-semibold underline">
        <i class="fa-regular fa-copy"></i> 전체 대본 복사
      </button>
    </div>
  </div>

  <script>
    // 쇼츠 큐시트 타임라인 데이터
    const scenes = [
      {
        start: 0,
        end: 3,
        section: "0~3초 후킹",
        badge: "HOOKING",
        title: "아직도 손가락으로?",
        speech: "아직도 손가락 아프게, 스마트폰 문자 일일이 치고 계신가요?",
        subtitle: "아직도 손가락 아프게…\n스마트폰 문자 일일이 치시나요?",
        bgStyle: "from-rose-950/60 to-stone-950",
        render: () => `
          <div class="space-y-4 animate-bounce">
            <div class="w-24 h-24 mx-auto rounded-3xl bg-red-600/20 border-2 border-red-500/50 flex items-center justify-center text-4xl text-red-400 shadow-xl">
              <i class="fa-solid fa-hand-pointer"></i>
            </div>
            <div class="bg-black/60 backdrop-blur-md px-4 py-2 rounded-2xl border border-red-500/30">
              <span class="text-red-400 font-black text-sm tracking-widest block mb-1">초반 3초 후킹</span>
              <h1 class="text-2xl font-black text-yellow-300 kinetic-text leading-tight">
                아직도 손가락 아프게<br><span class="text-white">문자 치고 계신가요?</span>
              </h1>
            </div>
          </div>
        `
      },
      {
        start: 4,
        end: 15,
        section: "4~15초 문제 공감",
        badge: "PAIN POINT",
        title: "오타 지우다 10분 훌쩍",
        speech: "눈도 침침한데 오타는 자꾸 나고, 긴 카톡 하나 보내려면 10분씩 걸려서 답답하셨죠? 이제 손가락 아프게 누르실 필요 전혀 없습니다!",
        subtitle: "눈 침침 + 오타 지우느라 속 터지던 분들 집중!",
        bgStyle: "from-amber-950/60 to-stone-950",
        render: () => `
          <div class="space-y-4">
            <div class="relative w-48 h-32 mx-auto bg-stone-900 border border-stone-700 rounded-2xl p-3 flex flex-col justify-between shadow-2xl">
              <div class="text-left text-xs text-stone-400 border-b border-stone-800 pb-1 flex justify-between">
                <span>카카오톡 대화방</span>
                <span class="text-rose-400 font-bold">오타 5개 발생</span>
              </div>
              <div class="bg-amber-500/10 text-amber-300 p-2 rounded text-xs text-left leading-relaxed font-mono">
                "안녕하세여 오늘 점시... <span class="bg-red-500/40 text-red-200 px-1 rounded">오타 지우는 중</span>"
              </div>
              <div class="flex justify-end text-stone-500 text-xs">
                <i class="fa-solid fa-delete-left text-red-400 animate-pulse text-base"></i>
              </div>
            </div>
            <div class="bg-black/60 backdrop-blur-md px-4 py-2 rounded-2xl border border-amber-500/30">
              <h2 class="text-xl font-black text-white kinetic-text">
                긴 카톡 하나에 <span class="text-amber-400">10분씩</span> 걸리셨죠?
              </h2>
              <p class="text-xs text-stone-300 mt-1">이제 손가락 아플 일 전혀 없습니다!</p>
            </div>
          </div>
        `
      },
      {
        start: 16,
        end: 35,
        section: "16~35초 핵심 시연",
        badge: "SOLUTION",
        title: "마이크 버튼 1초 탭",
        speech: "카카오톡이나 문자 창을 열고, 자판에 있는 '마이크 버튼' 딱 1초만 꾹 눌러보세요. 김 사장님, 오늘 점심 12시에 약속 장소에서 뵙겠습니다. 이렇게 평소 말투로 편하게 말씀만 하시면, 알아서 띄어쓰기까지 완벽하게 글자로 적힙니다.",
        subtitle: "키보드 속 '마이크 버튼' 1초 탭!\n말하는 대로 즉시 자동 완성!",
        bgStyle: "from-blue-950/60 to-stone-950",
        render: () => `
          <div class="space-y-4">
            <!-- 마이크 펄스 버튼 -->
            <div class="relative w-24 h-24 mx-auto">
              <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-yellow-400 to-amber-500 flex items-center justify-center text-4xl text-stone-950 shadow-2xl pulse-glow">
                <i class="fa-solid fa-microphone"></i>
              </div>
              <div class="absolute -top-2 -right-2 bg-red-600 text-[10px] font-black text-white px-2 py-0.5 rounded-full animate-bounce">
                1초 탭!
              </div>
            </div>

            <!-- 자동 타이핑 결과 시연 -->
            <div class="bg-stone-900/90 border border-yellow-400/40 rounded-2xl p-3.5 text-left shadow-2xl">
              <div class="flex items-center gap-2 mb-1.5 text-yellow-400 text-xs font-bold">
                <i class="fa-solid fa-wand-magic-sparkles"></i> AI 실시간 음성 변환 중...
              </div>
              <p class="text-sm font-bold text-white leading-relaxed typing-cursor">
                "김 사장님, 오늘 점심 12시에 약속 장소에서 뵙겠습니다."
              </p>
            </div>

            <div class="bg-black/60 backdrop-blur-md px-4 py-2 rounded-2xl border border-yellow-500/30">
              <h2 class="text-xl font-black text-yellow-300 kinetic-text">
                말만 하면 띄어쓰기까지 척척!
              </h2>
            </div>
          </div>
        `
      },
      {
        start: 36,
        end: 45,
        section: "36~45초 반전 인사이트",
        badge: "ACCURACY 99%",
        title: "속삭여도 다 알아듣는 AI",
        speech: "옛날 음성인식이 아닙니다! 주변이 조금 시끄럽거나 조용히 속삭여도 찰떡같이 알아듣습니다.",
        subtitle: "속삭여도 정확하게 인식하는 최신 AI!",
        bgStyle: "from-emerald-950/60 to-stone-950",
        render: () => `
          <div class="space-y-4">
            <div class="w-24 h-24 mx-auto rounded-3xl bg-emerald-500/20 border-2 border-emerald-400/50 flex items-center justify-center text-4xl text-emerald-300 shadow-xl">
              <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div class="bg-black/60 backdrop-blur-md px-4 py-2 rounded-2xl border border-emerald-500/30">
              <span class="text-emerald-400 font-black text-xs block mb-1">옛날 음성인식이 아닙니다!</span>
              <h2 class="text-2xl font-black text-white kinetic-text">
                시끄러운 곳에서도 <span class="text-emerald-400">99% 정확도</span>
              </h2>
              <p class="text-xs text-stone-300 mt-1">조용히 속삭여도 또박또박 받아적습니다</p>
            </div>
          </div>
        `
      },
      {
        start: 46,
        end: 58,
        section: "46~58초 마무리 & CTA",
        badge: "CALL TO ACTION",
        title: "기종별 위치 댓글 남기기",
        speech: "지금 바로 카톡 켜고 마이크 버튼 한번 눌러보세요! 기종마다 버튼 위치를 잘 못 찾으시겠다면, 댓글로 휴대폰 기종을 남겨주세요. 제가 바로 답글로 위치를 짚어드릴게요!",
        subtitle: "지금 바로 카톡 켜고 시험해 보세요!\n기종 헷갈리면 댓글로 질문 남기기!",
        bgStyle: "from-purple-950/60 to-stone-950",
        render: () => `
          <div class="space-y-4">
            <div class="w-24 h-24 mx-auto rounded-3xl bg-purple-500/20 border-2 border-purple-400/50 flex items-center justify-center text-4xl text-purple-300 shadow-xl animate-pulse">
              <i class="fa-solid fa-comments"></i>
            </div>
            <div class="bg-black/60 backdrop-blur-md px-4 py-3 rounded-2xl border border-purple-500/30">
              <h2 class="text-xl font-black text-yellow-300 kinetic-text mb-1">
                지금 카톡 켜고 눌러보세요!
              </h2>
              <p class="text-xs text-stone-200 leading-relaxed">
                마이크 버튼 위치를 못 찾으시겠다면<br>
                <span class="text-purple-300 font-bold underline">휴대폰 기종을 댓글로</span> 남겨주세요!
              </p>
            </div>
          </div>
        `
      }
    ];

    const totalDuration = 58;
    let currentTime = 0;
    let isPlaying = false;
    let timer = null;
    let currentSceneIndex = -1;
    let synth = window.speechSynthesis;

    // 큐 리스트 렌더링
    const cueListEl = document.getElementById("cueList");
    scenes.forEach((sc, idx) => {
      const item = document.createElement("div");
      item.id = `cue-item-${idx}`;
      item.className = "p-3 rounded-xl bg-stone-950 border border-stone-800 transition cursor-pointer hover:border-stone-700";
      item.onclick = () => jumpToTime(sc.start);
      item.innerHTML = `
        <div class="flex justify-between items-center mb-1">
          <span class="text-[11px] font-bold text-amber-400">${sc.section}</span>
          <span class="text-[10px] font-mono text-stone-500">${formatTime(sc.start)} ~ ${formatTime(sc.end)}</span>
        </div>
        <div class="text-xs font-bold text-stone-200">${sc.title}</div>
        <div class="text-[11px] text-stone-400 truncate mt-0.5">${sc.speech}</div>
      `;
      cueListEl.appendChild(item);
    });

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateClock() {
      const now = new Date();
      document.getElementById("clockDisplay").innerText = 
        `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function updateScene(time) {
      const sceneIndex = scenes.findIndex(s => time >= s.start && time <= s.end);
      if (sceneIndex !== -1 && sceneIndex !== currentSceneIndex) {
        currentSceneIndex = sceneIndex;
        const currentScene = scenes[sceneIndex];

        // 씬 그래픽 업데이트
        const container = document.getElementById("sceneContainer");
        container.innerHTML = currentScene.render();

        // 큐 하이라이트 업데이트
        scenes.forEach((_, i) => {
          const el = document.getElementById(`cue-item-${i}`);
          if (i === sceneIndex) {
            el.className = "p-3 rounded-xl bg-amber-500/20 border-2 border-amber-400 shadow-md transition";
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          } else {
            el.className = "p-3 rounded-xl bg-stone-950 border border-stone-800 transition cursor-pointer hover:border-stone-700";
          }
        });

        // TTS 음성 재생 (옵션 켜져 있을 때)
        if (isPlaying && document.getElementById("ttsToggle").checked && synth) {
          synth.cancel();
          const utter = new SpeechSynthesisUtterance(currentScene.speech);
          utter.lang = 'ko-KR';
          utter.rate = 1.05;
          synth.speak(utter);
        }
      }
    }

    function tick() {
      if (currentTime >= totalDuration) {
        pausePlayback();
        currentTime = totalDuration;
        updateUI();
        return;
      }
      currentTime += 1;
      updateUI();
    }

    function updateUI() {
      const pct = (currentTime / totalDuration) * 100;
      document.getElementById("progressBar").style.width = `${pct}%`;
      document.getElementById("currentTimeLabel").innerText = formatTime(currentTime);
      updateScene(currentTime);
    }

    function togglePlay() {
      if (isPlaying) {
        pausePlayback();
      } else {
        startPlayback();
      }
    }

    function startPlayback() {
      if (currentTime >= totalDuration) {
        currentTime = 0;
      }
      isPlaying = true;
      document.getElementById("centerPlayBtn").classList.add("hidden");
      document.getElementById("sidePlayText").innerText = "일시정지";
      document.getElementById("sidePlayBtn").classList.replace("bg-red-600", "bg-amber-600");

      updateScene(currentTime);
      timer = setInterval(tick, 1000);
    }

    function pausePlayback() {
      isPlaying = false;
      clearInterval(timer);
      if (synth) synth.cancel();
      document.getElementById("centerPlayBtn").classList.remove("hidden");
      document.getElementById("sidePlayText").innerText = "영상 재생";
      document.getElementById("sidePlayBtn").classList.replace("bg-amber-600", "bg-red-600");
    }

    function resetPlayback() {
      pausePlayback();
      currentTime = 0;
      currentSceneIndex = -1;
      updateUI();
    }

    function jumpToTime(sec) {
      currentTime = sec;
      updateUI();
      if (!isPlaying) {
        startPlayback();
      }
    }

    function seek(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = Math.max(0, Math.min(1, clickX / rect.width));
      currentTime = Math.floor(pct * totalDuration);
      updateUI();
    }

    let isLiked = false;
    function toggleLike() {
      isLiked = !isLiked;
      const btn = document.getElementById("likeBtn");
      const cnt = document.getElementById("likeCount");
      if (isLiked) {
        btn.classList.add("text-red-500", "bg-white/20");
        cnt.innerText = "4.3K";
      } else {
        btn.classList.remove("text-red-500", "bg-white/20");
        cnt.innerText = "4.2K";
      }
    }

    function copyFullScript() {
      const fullText = scenes.map(s => `[${s.section}] ${s.title}\n대사: ${s.speech}`).join("\n\n");
      navigator.clipboard.writeText(fullText).then(() => {
        alert("전체 60초 대본이 클립보드에 복사되었습니다!");
      });
    }

    // 초기 상태 렌더링
    updateUI();
  </script>
</body>
</html>
